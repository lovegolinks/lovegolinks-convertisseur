<!doctype html>
<html lang="fr">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" />
<script>
  (function () {
    var dark = true;
    try { dark = localStorage.getItem("theme") !== "light"; } catch (e) {}
    if (dark) document.documentElement.classList.add("dark");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", dark ? "#0c0e14" : "#f5f6fa");
  })();
</script>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #14161f; --muted: #5b6075;
    --border: #dfe2ea; --field: #eef0f5; --gold: #d4a853; --gold-hover: #e8bc62;
    --gold-ink: #a8741a; --danger: #b3412f; --shadow: 0 10px 30px -14px rgba(20, 22, 31, 0.25);
  }
  html.dark {
    --bg: #0c0e14; --card: #161924; --text: #eef0f6; --muted: #b0b5c8;
    --border: #262a38; --field: #0f1118; --gold-ink: #e8bc62; --danger: #ff8a7a; --shadow: 0 10px 30px -14px rgba(0, 0, 0, 0.7);
  }
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); overflow-x: hidden;
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
  }
  .wrap { position: relative; max-width: 520px; margin: 0 auto; padding: 20px 20px 48px; text-align: center; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; }
  .topbar .icon-btn { margin-left: auto; }
  .back { color: var(--muted); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--text); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--gold); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }
  .sun { display: none; } html.dark .sun { display: block; } html.dark .moon { display: none; }

  /* Animation : les agents tournent autour du logo, dispersés, tous dans le même sens */
  .stage { --size: min(400px, 90vw); position: relative; width: var(--size); height: var(--size); margin: 6px auto 4px; }
  .halo { position: absolute; inset: -14%; border-radius: 50%; background: radial-gradient(circle, rgba(212, 168, 83, 0.22), transparent 66%); }
  .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px dashed var(--border); border-radius: 50%; opacity: 0.7; }
  .ring-a { width: calc(var(--size) * 0.37); height: calc(var(--size) * 0.37); }
  .ring-b { width: calc(var(--size) * 0.595); height: calc(var(--size) * 0.595); }
  .ring-c { width: calc(var(--size) * 0.83); height: calc(var(--size) * 0.83); }
  #orbits { position: absolute; inset: 0; }
  .orbit { position: absolute; inset: 0; animation: spin var(--dur) linear infinite; }
  .chip {
    position: absolute; top: 50%; left: 50%;
    width: calc(var(--size) * var(--s)); height: calc(var(--size) * var(--s));
    margin: calc(var(--size) * var(--s) * -0.5) 0 0 calc(var(--size) * var(--s) * -0.5);
    transform: rotate(var(--a)) translateX(calc(var(--size) * var(--r))) rotate(calc(var(--a) * -1));
  }
  .chip-in {
    position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; overflow: hidden;
    border-radius: 50%; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
    color: var(--muted); font-size: max(9px, calc(var(--size) * var(--s) * 0.27)); font-weight: 600;
    animation: spin-rev var(--dur) linear infinite;
  }
  .chip-in img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; }
  .core {
    position: absolute; top: 50%; left: 50%; width: calc(var(--size) * 0.24); height: calc(var(--size) * 0.24);
    transform: translate(-50%, -50%); overflow: hidden; display: flex; align-items: center; justify-content: center;
    border-radius: 28%; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--gold);
  }
  .core svg { width: 42%; height: 42%; }
  .core img { position: absolute; inset: 0; width: 100%; height: 100%; padding: 14%; object-fit: contain; background: var(--card); }
  .core .core-mascot { background: #ffffff; padding: 10%; }
  .core:has(.core-mascot) { border-color: var(--gold); }
  .core-badge {
    position: absolute; top: 50%; left: 50%; z-index: 2;
    width: calc(var(--size) * 0.095); height: calc(var(--size) * 0.095);
    transform: translate(calc(var(--size) * 0.07), calc(var(--size) * 0.07));
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: linear-gradient(145deg, #f1d189, #d4a853); color: #0a0b0e;
    border: 4px solid var(--bg); box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.6);
  }
  .core-badge svg { width: 52%; height: 52%; }
  .core-dark { display: none; } html.dark .core-light { display: none; } html.dark .core-dark { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  @media (prefers-reduced-motion: reduce) { .orbit, .chip-in { animation: none; } }

  h1 { margin: 10px 0 10px; font-size: clamp(1.9rem, 7vw, 2.5rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .by { display: inline-block; padding: 3px 12px; border-radius: 999px; background: rgba(212, 168, 83, 0.16); color: var(--gold-ink); font-size: 13px; font-weight: 600; }
  .lead { margin: 14px 0 26px; color: var(--muted); font-size: 16px; }

  .box { padding: 14px; border-radius: 28px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .inputrow { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--field); }
  .inputrow:focus-within { border-color: var(--gold); }
  .inputrow input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: 400 16px "DM Sans", system-ui, sans-serif; padding: 10px 0; }
  .inputrow input::placeholder { color: var(--muted); opacity: 0.8; }
  .paste { flex-shrink: 0; padding: 9px 16px; border: 0; border-radius: 999px; background: rgba(212, 168, 83, 0.18); color: var(--gold-ink); font: 600 14px "DM Sans", sans-serif; cursor: pointer; }
  .paste:hover { background: rgba(212, 168, 83, 0.3); }
  .clear { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
  .clear:hover { background: rgba(127, 127, 127, 0.16); color: var(--text); }
  .clear[hidden] { display: none; }
  .go {
    display: block; width: 100%; margin-top: 10px; padding: 16px; border: 0; border-radius: 999px; background: var(--gold); color: #0a0b0e;
    font: 700 17px "DM Sans", system-ui, sans-serif; cursor: pointer; transition: background .15s, opacity .15s;
  }
  .go:hover:not(:disabled) { background: var(--gold-hover); }
  .go:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn:focus-visible, .link-btn:focus-visible, .icon-btn:focus-visible, .go:focus-visible, .paste:focus-visible, .clear:focus-visible, a:focus-visible, select:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  #out { text-align: left; }
  .result { margin-top: 14px; padding: 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--border); }
  .result.bad { border-color: var(--danger); }
  .head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .badge { padding: 3px 11px; border-radius: 999px; background: rgba(212, 168, 83, 0.16); color: var(--gold-ink); font-size: 13px; font-weight: 600; }
  .pid { color: var(--muted); font-size: 14px; }
  .note { margin: 10px 0 0; font-size: 13px; color: var(--gold-ink); }
  .msg { margin: 0; font-size: 14px; }
  .bad .msg { color: var(--danger); }
  .src { margin: 0 0 6px; font-size: 13px; color: var(--muted); word-break: break-all; }
  .field {
    width: 100%; margin-top: 12px; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--field); color: var(--text); font: 400 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .field:focus, select:focus { outline: none; border-color: var(--gold); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn {
    flex: 1 1 140px; display: inline-flex; align-items: center; justify-content: center; padding: 11px 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font: 600 14px/1.2 "DM Sans", system-ui, sans-serif; cursor: pointer; text-decoration: none;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #0a0b0e; }
  .btn.gold:hover { background: var(--gold-hover); border-color: var(--gold-hover); }
  .direct { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .direct a { color: var(--muted); word-break: break-all; }
  .direct a:hover { color: var(--text); }
  .link-btn { border: 0; background: none; padding: 0; margin-left: 6px; color: var(--gold-ink); font: 600 13px "DM Sans", sans-serif; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  select { margin-top: 12px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--field); color: var(--text); font: 500 14px "DM Sans", sans-serif; }

  .legal { margin: 26px auto 0; max-width: 44ch; font-size: 13px; color: var(--muted); }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    padding: 10px 18px; border-radius: 999px; background: var(--gold); color: #0a0b0e; font: 600 14px "DM Sans", sans-serif;
    transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" id="back" href="#" hidden>Voir le catalogue</a>
    <button class="icon-btn" id="theme" type="button" aria-label="Changer de thème">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="stage" aria-hidden="true">

    <div class="ring ring-a"></div>

    <div id="orbits"></div>
    <div class="core">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M3 7h18"/><path d="M7 21l-4-4 4-4"/><path d="M21 17H3"/></svg>
      <img class="core-mascot" src="/lovegobuy.png" alt="Lovegobuy" onerror="this.remove()" />

  </div>

  <main>
    <h1>Convertisseur Lovegobuy</h1>
    <span class="by">par lovegolinks</span>
    <p class="lead">Colle le lien d'un agent et ouvre-le directement sur Lovegobuy.</p>

    <div class="box">
      <div class="inputrow">
        <input id="input" type="text" inputmode="url" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Lien du produit" placeholder="Colle ton lien ici…" />
        <button class="clear" id="clear" type="button" aria-label="Effacer le lien" title="Effacer" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>

  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const INVITE_CODE = "8T6UW8";
const LOVEGO_URL = "https://www.lovegobuy.com/product";

const PLATFORMS = {
  weidian: { label: "Weidian", direct: (id) => "https://weidian.com/item.html?itemID=" + id },
  taobao: { label: "Taobao", direct: (id) => "https://item.taobao.com/item.htm?id=" + id },
  ali_1688: { label: "1688", direct: (id) => "https://detail.1688.com/offer/" + id + ".html" },
};

function normPlatform(v) {
  const s = String(v || "").toLowerCase().replace(/[^a-z0-9_]/g, "");
  if (["weidian", "wd", "micro", "vdian", "koudai"].includes(s)) return "weidian";
  if (["taobao", "tb", "tmall", "tm"].includes(s)) return "taobao";
  if (["1688", "ali1688", "ali_1688", "al", "ali", "alibaba"].includes(s)) return "ali_1688";
  return "";
}

// Certains agents indiquent la plateforme par un chiffre dans l'adresse (/product/2/ID).
// Le code change d'un agent à l'autre. "sure" = codes confirmés sur de vrais liens d'agents.
const CODE_FAMILIES = [
  { re: /(?:^|\.)litbuy\./i, map: { 0: "ali_1688", 1: "taobao", 2: "weidian" }, sure: ["0", "1", "2"] },
  { re: /(?:^|\.)hoobuy\./i, map: { 0: "ali_1688", 1: "taobao", 2: "weidian" }, sure: ["0", "2"] },
  { re: /(?:^|\.)(?:oopbuy|ponybuy)\./i, map: { 0: "ali_1688", 1: "taobao", 2: "weidian" }, sure: ["1"] },
  { re: /(?:^|\.)usfans\./i, map: { 1: "ali_1688", 2: "taobao", 3: "weidian" }, sure: ["3"] },
];
function codeFamily(hostname) {
  return CODE_FAMILIES.find((f) => f.re.test(hostname)) || null;
}

function buildLovego(id, platform) {
  return LOVEGO_URL + "?id=" + id + "&shop_type=" + platform + "&invite_code=" + INVITE_CODE;
}

function decodedVariants(s) {
  const out = [s];
  let cur = s;
  for (let i = 0; i < 3; i++) {
    let d;
    try { d = decodeURIComponent(cur); } catch (e) { break; }
    if (d === cur) break;
    out.push(d);
    cur = d;
  }
  return out;
}

// Liens des marchés d'origine (Weidian, 1688, Taobao, Tmall), même cachés dans un lien d'agent.
const RAW_PATTERNS = [
  { p: "weidian", re: /weidian\.com\/[^\s'"<>]*?[?&]item_?id=(\d{6,})/i },
  { p: "ali_1688", re: /1688\.com\/offer\/(\d{6,})\.html/i },
  { p: "ali_1688", re: /1688\.com\/[^\s'"<>]*?[?&]offer_?id=(\d{6,})/i },
  { p: "taobao", re: /(?:taobao|tmall)\.com\/[^\s'"<>]*?[?&](?:id|item_?id)=(\d{6,})/i },
];

function fromRaw(variants) {
  for (const v of variants) {
    for (const { p, re } of RAW_PATTERNS) {
      const m = v.match(re);
      if (m) return { id: m[1], platform: p, guessed: false };
    }
  }
  return null;
}

// Liens d'agents : id et plateforme dans l'adresse ou dans ses paramètres.
function fromAgent(variants) {
  const text = variants[0];
  let url;
  try { url = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : "https://" + text); } catch (e) { return null; }
  const params = {};
  url.searchParams.forEach((val, key) => { params[key.toLowerCase()] = val; });
  const pick = (...keys) => { for (const k of keys) if (params[k]) return params[k]; return ""; };

  let id = pick("id", "itemid", "item_id", "productid", "product_id", "goodsid", "goods_id", "offerid", "spuid", "keyword");
  let platform = normPlatform(pick("shop_type", "platform", "channel", "source", "type", "store", "from"));
  let guessed = false;
  const path = url.pathname;
  let m;

  if ((m = path.match(/item-(1688|micro|taobao|weidian|tmall)-(\d{6,})/i))) {
    platform = platform || normPlatform(m[1]);
    id = m[2];
  } else if ((m = path.match(/item-(\d{6,})\.html/i))) {
    id = m[1];
    if (!platform) { platform = "taobao"; guessed = !/cssbuy\./i.test(url.hostname); }
  } else if ((m = path.match(/\/(weidian|taobao|tmall|1688|wd|tb|ali_1688|micro)\/(\d{6,})/i))) {
    platform = normPlatform(m[1]);
    id = m[2];
  } else if ((m = path.match(/\/(?:product|item|goods|detail)s?\/(\d)\/(\d{6,})/i))) {
    id = m[2];
    const fam = codeFamily(url.hostname);
    if (!platform && fam && fam.map[m[1]]) {
      platform = fam.map[m[1]];
      guessed = !fam.sure.includes(m[1]);
    }
  } else if (!id && (m = path.match(/\/(\d{9,})(?:\/|\.html|$)/))) {
    id = m[1];
  }

  if (!/^\d{6,}$/.test(id || "")) return null;

  if (!platform) {
    const rest = variants[variants.length - 1].split(id).join(" ");
    if (/weidian|vdian/i.test(rest)) platform = "weidian";
    else if (/(^|[^0-9])1688([^0-9]|$)|alibaba/i.test(rest)) platform = "ali_1688";
    else if (/taobao|tmall/i.test(rest)) platform = "taobao";
    if (platform) guessed = true;
  }
  if (!platform && id.length <= 10) { platform = "weidian"; guessed = true; }
  return { id, platform, guessed };
}

const SHORT_HOSTS = [
  "m.tb.cn", "tb.cn", "e.tb.cn", "click.world.taobao.com", "s.click.taobao.com", "k.weidian.com", "weidian.info",
  "k.youshop10.com", "qr.1688.com", "pandabuy.page.link", "page.link", "app.link", "hoobuy.cc", "oopbuy.cc",
  "l.acbuy.com", "link.acbuy.com", "sl.hegobuy.com", "ihego.vip", "ikako.vip", "sl.kakobuy.com",
  "blikbuy.seewebs.com", "itaobuy.allapp.link", "cssbuy.allapp.link", "hipobuy.cn", "litbuy.shop",
  "gateway.litbuy.com", "bit.ly", "tinyurl.com",
];

function isShortLink(text) {
  try {
    const u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(text) ? text : "https://" + text);
    return SHORT_HOSTS.some((h) => u.hostname === h || u.hostname.endsWith("." + h));
  } catch (e) { return false; }
}

function convertOne(text) {
  const variants = decodedVariants(text.trim());
  const found = fromRaw(variants) || fromAgent(variants);
  if (found) return { ok: true, input: text, id: found.id, platform: found.platform, guessed: found.guessed };
  return { ok: false, input: text, short: isShortLink(text) };
}

function splitLinks(raw) {
  return String(raw || "").split(/[\s,;]+/).filter((t) => t.length > 5 && /[./]/.test(t));
}

const $ = (s) => document.querySelector(s);

// Optionnel : colle ici l'adresse de ton catalogue pour afficher un lien "Voir le catalogue" en haut de la page.
const CATALOGUE_URL = "";
if (CATALOGUE_URL) { const back = $("#back"); back.href = CATALOGUE_URL; back.hidden = false; }
const input = $("#input");
const go = $("#go");
const out = $("#out");
const toastEl = $("#toast");

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach((c) => { if (c != null) e.append(c); });
  return e;
}

// Agents qui tournent autour du logo. Pour afficher un vrai logo, ajoute une image
// "public/agents/<fichier>.png" : sans image, la pastille affiche le nom court.
const AGENTS = [
  { name: "Pandabuy", file: "pandabuy", short: "Pnd" },
  { name: "CNFans", file: "cnfans", short: "CNF" },
  { name: "Mulebuy", file: "mulebuy", short: "Mule" },
  { name: "Litbuy", file: "litbuy", short: "Lit" },
  { name: "Hagobuy", file: "hagobuy", short: "Hago" },
  { name: "AllChinaBuy", file: "allchinabuy", short: "All" },
  { name: "Joyagoo", file: "joyagoo", short: "Joya" },
  { name: "Goonbuy", file: "goonbuy", short: "Goon" },
  { name: "Hipobuy", file: "hipobuy", short: "Hipo" },
  { name: "Oopbuy", file: "oopbuy", short: "Oop" },
  { name: "Kakobuy", file: "kakobuy", short: "Kako" },
  { name: "CSSBuy", file: "cssbuy", short: "CSS" },
  { name: "Sugargoo", file: "sugargoo", short: "Sug" },
  { name: "ACBuy", file: "acbuy", short: "AC" },
  { name: "Usfans", file: "usfans", short: "USF" },
  { name: "Superbuy", file: "superbuy", short: "Sup" },
  { name: "Wegobuy", file: "wegobuy", short: "Wego" },
  { name: "Hoobuy", file: "hoobuy", short: "Hoo" },
  { name: "Basetao", file: "basetao", short: "Base" },
  { name: "Itaobuy", file: "itaobuy", short: "Itao" },
];

// Positions volontairement irrégulières (angle en degrés, distance et taille en fraction de la zone).
// Trois anneaux qui tournent dans le même sens, à des vitesses différentes.
const RINGS = [
  { dur: "34s", chips: [
    { a: 20, r: 0.185, s: 0.09 },
    { a: 98, r: 0.19, s: 0.085 },
    { a: 171, r: 0.18, s: 0.09 },
    { a: 240, r: 0.19, s: 0.088 },
    { a: 318, r: 0.185, s: 0.085 },
  ] },
  { dur: "52s", chips: [
    { a: 0, r: 0.295, s: 0.09 },
    { a: 44, r: 0.3, s: 0.088 },
    { a: 112, r: 0.29, s: 0.09 },
    { a: 150, r: 0.298, s: 0.086 },
    { a: 215, r: 0.3, s: 0.09 },
    { a: 262, r: 0.292, s: 0.088 },
    { a: 318, r: 0.297, s: 0.09 },
  ] },
  { dur: "80s", chips: [
    { a: 8, r: 0.41, s: 0.1 },
    { a: 63, r: 0.42, s: 0.095 },
    { a: 110, r: 0.412, s: 0.1 },
    { a: 147, r: 0.418, s: 0.098 },
    { a: 205, r: 0.41, s: 0.1 },
    { a: 251, r: 0.42, s: 0.095 },
    { a: 302, r: 0.415, s: 0.098 },
    { a: 338, r: 0.413, s: 0.1 },
  ] },
];

const orbits = $("#orbits");
let n = 0;
RINGS.forEach((ring) => {
  const orbit = el("div", { class: "orbit", style: "--dur:" + ring.dur });
  ring.chips.forEach((c) => {
    const a = AGENTS[n++];
    orbit.append(
      el("div", { class: "chip", style: "--a:" + c.a + "deg;--r:" + c.r + ";--s:" + c.s },
        el("span", { class: "chip-in", title: a.name },
          a.short,
          el("img", { src: "/agents/" + a.file + ".png", alt: "", onerror: (e) => e.target.remove() })
        )
      )
    );
  });
  orbits.append(orbit);
});

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = el("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.append(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  toast(msg || "Lien copié");
}

function shorten(t) {
  return t.length > 72 ? t.slice(0, 70) + "…" : t;
}

function card(it) {
  if (!it.ok) {
    const msg = it.short
      ? "Ce lien raccourci ne peut pas être lu ici. Ouvre-le dans ton navigateur, copie l'adresse complète de la page produit, puis colle-la ici."
      : "Lien non reconnu. Vérifie qu'il s'agit d'un lien produit complet.";
    return el("article", { class: "result bad" },
      el("p", { class: "src", text: shorten(it.input) }),
      el("p", { class: "msg", text: msg })
    );
  }

  if (!it.platform) {
    const select = el("select", {
      "aria-label": "Plateforme du produit",
      onchange: (e) => { it.platform = e.target.value; it.guessed = false; it.manual = true; render(); },
    },
      el("option", { value: "", text: "Choisir la plateforme" }),
      ...Object.entries(PLATFORMS).map(([k, p]) => el("option", { value: k, text: p.label }))
    );
    return el("article", { class: "result" },
      el("p", { class: "src", text: shorten(it.input) }),
      el("p", { class: "msg", text: "Produit " + it.id + " trouvé, mais la plateforme n'est pas indiquée dans ce lien." }),
      select
    );
  }

  const p = PLATFORMS[it.platform];
  const lovego = buildLovego(it.id, it.platform);
  const direct = p.direct(it.id);
  const field = el("input", { class: "field", type: "text", readonly: "", value: lovego, "aria-label": "Lien Lovegobuy" });
  field.addEventListener("focus", () => field.select());

  return el("article", { class: "result" },
    el("div", { class: "head" },
      el("span", { class: "badge", text: p.label }),
      el("span", { class: "pid", text: "Produit " + it.id })
    ),
    (it.guessed || it.manual)
      ? el("p", { class: "note", text: it.manual
          ? "Plateforme choisie à la main : ouvre le lien et vérifie que le produit correspond."
          : "Plateforme supposée d'après le lien : vérifie que le produit correspond." })
      : null,
    field,
    el("div", { class: "actions" },
      el("a", { class: "btn gold", href: lovego, target: "_blank", rel: "noopener noreferrer sponsored", text: "Ouvrir sur Lovegobuy" }),
      el("button", { class: "btn", type: "button", text: "Copier le lien", onclick: () => copyText(lovego) })
    ),
    el("p", { class: "direct" },
      "Lien direct " + p.label + " : ",
      el("a", { href: direct, target: "_blank", rel: "noopener noreferrer", text: direct }),
      el("button", { class: "link-btn", type: "button", text: "Copier", onclick: () => copyText(direct, "Lien direct copié") })
    )
  );
}

let items = [];
function render() {
  out.replaceChildren();
  items.forEach((it) => out.append(card(it)));
}

// Statistiques : chaque produit converti est compté une fois par visite (aucune donnée personnelle).
const STATS_URL = "https://lovegolinks-robot.lovegolinks.workers.dev/conv";
const counted = new Set();
function trackConversions(list) {
  const ids = list.filter((it) => it.ok && !counted.has(it.id)).map((it) => it.id);
  if (!ids.length || !STATS_URL) return;
  ids.forEach((id) => counted.add(id));
  try {
    const body = JSON.stringify({ ids });
    if (navigator.sendBeacon) navigator.sendBeacon(STATS_URL, new Blob([body], { type: "text/plain" }));
    else fetch(STATS_URL, { method: "POST", body, keepalive: true, mode: "no-cors" }).catch(() => {});
  } catch (e) {}
}

function run() {
  const value = input.value.trim();
  if (!value) { items = []; render(); return; }
  const links = splitLinks(value);
  items = links.length ? links.map(convertOne) : [{ ok: false, input: value, short: false }];
  render();
  trackConversions(items);
}

function sync() {
  const empty = input.value.trim().length === 0;
  go.disabled = empty;
  $("#clear").hidden = input.value.length === 0;
}

// Croix : efface le lien saisi et les résultats.
$("#clear").addEventListener("click", () => {
  input.value = "";
  items = [];
  render();
  sync();
  input.focus();
});

input.addEventListener("input", sync);
input.addEventListener("paste", () => setTimeout(() => { sync(); run(); }, 0));
input.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
go.addEventListener("click", run);
$("#paste").addEventListener("click", async () => {
  try {
    input.value = await navigator.clipboard.readText();
    sync();
    run();
  } catch (e) {
    input.focus();
    toast("Colle le lien avec Ctrl+V dans le champ");
  }
});

$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0c0e14" : "#f5f6fa");
});

const preset = new URLSearchParams(location.search).get("url");
if (preset) { input.value = preset; sync(); run(); }
</script>
